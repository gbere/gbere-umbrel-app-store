manifestVersion: 1
id: gbere-power-nut
name: Network UPS Tools
version: "2.8.3.1"
tagline: Monitor and manage your UPS with NUT
icon: https://raw.githubusercontent.com/gbere/gbere-umbrel-app-gallery/main/gbere-power-nut/logo.png
category: system
port: 3493
description: >-
  Network UPS Tools is a collection of programs which provide a common
  interface for monitoring and administering UPS, PDU and SCD hardware.
  It uses a layered approach to connect all of the parts.


  The NUT server (upsd) listens on TCP port 3493. Connect your NUT
  clients (upsmon, PeaNUT, Home Assistant, etc.) to umbrel.local:3493
  using the username and password shown below.
developer: Network UPS Tools
website: https://networkupstools.org/
submitter: gBere
submission: https://github.com/gbere/gbere-umbrel-app-store
repo: https://github.com/networkupstools/nut
support: https://networkupstools.org/support.html
gallery:
  - https://i.imgur.com/yyVG0Jb.jpeg
releaseNotes: >-
  Fixed host port conflict by removing the HTTP proxy (NUT speaks raw TCP
  on port 3493). The NUT password is now generated per-install by umbrelOS
  and shown in the app page — update your NUT clients (upsmon, Home
  Assistant, PeaNUT, etc.) with the new credentials after updating.
dependencies: []
path: ""
deterministicPassword: true
defaultUsername: "upsmon"
defaultPassword: ""
