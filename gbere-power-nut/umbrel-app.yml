manifestVersion: 1
id: gbere-power-nut
name: Network UPS Tools
version: "2.8.3.2"
tagline: Monitor and manage your UPS with NUT
icon: https://raw.githubusercontent.com/gbere/gbere-umbrel-app-gallery/main/gbere-power-nut/logo.png
category: system
port: 3494
description: >-
  Network UPS Tools is a collection of programs which provide a common
  interface for monitoring and administering UPS, PDU and SCD hardware.


  This app packages two services:


  - NUT server (upsd): talks to your UPS over USB and exposes the
  standard NUT TCP protocol on port 3493, so external clients such as
  upsmon, Home Assistant or other PeaNUT instances can connect to
  umbrel.local:3493.

  - PeaNUT web dashboard: the interface behind the app's "Open" button,
  showing your UPS status (battery charge, load, estimated runtime,
  variables, etc.) in your browser.


  Credentials: the NUT username and a unique per-install password are
  shown on this page. Use them to connect your NUT clients (host:
  umbrel.local, port: 3493, username: upsmon).


  Home Assistant integration: add the NUT integration
  (https://www.home-assistant.io/integrations/nut/) in Home Assistant
  and point it to umbrel.local:3493 with the credentials shown on this
  page. More info: https://github.com/gbere/gbere-umbrel-app-store
developer: Network UPS Tools
website: https://networkupstools.org/
submitter: gBere
submission: https://github.com/gbere/gbere-umbrel-app-store
repo: https://github.com/networkupstools/nut
support: https://networkupstools.org/support.html
gallery:
  - https://raw.githubusercontent.com/Brandawg93/PeaNUT/main/images/charts.png
releaseNotes: >-
  Added the PeaNUT web dashboard: the "Open" button now shows your UPS
  status in the browser instead of pointing at the raw NUT TCP port,
  which is not a web page. NUT clients (upsmon, Home Assistant, etc.)
  still connect to umbrel.local:3493 with the credentials shown in the
  app page.
dependencies: []
path: ""
deterministicPassword: true
defaultUsername: "upsmon"
defaultPassword: ""
