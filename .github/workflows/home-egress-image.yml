name: home-egress image

# Builds the image behind the Home Egress app for both architectures umbrelOS
# runs on, and pushes it to GHCR. Pin the resulting digest in
# gbere-home-egress/docker-compose.yml.
on:
  push:
    tags: ["home-egress-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Image tag, e.g. 1.0.0
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "tag=${INPUT_VERSION:-${GITHUB_REF_NAME#home-egress-v}}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: gbere-home-egress/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/gbere/home-egress:${{ steps.version.outputs.tag }}
